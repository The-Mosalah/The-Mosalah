.s1{animation:k1 12s linear infinite}@keyframes k1{0%,7%{opacity:0}8%,59%{opacity:1}60%,100%{opacity:0}}
.s2{animation:k2 12s linear infinite}@keyframes k2{0%,59%{opacity:0}60%,71%{opacity:1}72%,100%{opacity:0}}
.s3{animation:k3 12s linear infinite}@keyframes k3{0%,71%{opacity:0}72%,91%{opacity:1}92%,100%{opacity:0}}
.tg{opacity:0;animation:tgl 12s linear infinite}
@keyframes tgl{0%{opacity:0;transform:translateY(6px)}3%,30%{opacity:1;transform:none}34%,100%{opacity:0}}
.sh{animation:sh 6s ease-in-out infinite}@keyframes sh{50%{opacity:.55}}
.bl{animation:bk 1s steps(1) infinite}@keyframes bk{50%{opacity:0}}
 (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important}}
</style>
