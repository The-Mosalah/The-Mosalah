<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Animated smartphone power circuit map from USB-C input to PMIC, CPU and UFS">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081a36"/><stop offset=".6" stop-color="#040b1a"/><stop offset="1" stop-color="#19110d"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1f4f9a" stroke-opacity=".18"/></pattern><style>text{font-family:Segoe UI,Arial,sans-serif}.m{font-family:Consolas,monospace}.wire{fill:none;stroke:#c9803f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.ghost{fill:none;stroke:#1f4f9a;stroke-width:2}.label{fill:#f4f1e8;font-size:16px;font-weight:700}.sub{fill:#8fd8ff;font-size:12px}.chip{fill:#09172c;stroke:#c9803f;stroke-width:2}.hot{fill:#8fd8ff;filter:url(#g)}@media(prefers-reduced-motion:reduce){animate,animateMotion,animateTransform{display:none}}</style></defs>
<rect width="1200" height="400" rx="18" fill="url(#bg)"/><rect width="1200" height="400" rx="18" fill="url(#grid)" opacity=".5"/><rect x="1" y="1" width="1198" height="398" rx="17" fill="none" stroke="#1f4f9a"/>
<text x="42" y="52" class="label" font-size="26">LIVE POWER PATH</text><text x="43" y="76" class="m sub">INPUT → CHARGE CONTROL → PMIC → BOOT DOMAINS</text><circle cx="1148" cy="48" r="5" class="hot"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="1130" y="52" text-anchor="end" class="m sub">TRACE ACTIVE</text>
<path class="ghost" d="M104 205H234l34-46h150l35 46h123M576 205l70-82h155l35 82M576 205l70 82h155l35-82M960 205h130"/>
<path class="wire" d="M104 205H234l34-46h150l35 46h123M576 205l70-82h155l35 82M576 205l70 82h155l35-82M960 205h130"/>
<g transform="translate(65 170)"><path d="M0 22h50v26H0z" fill="#0a182d" stroke="#8fd8ff" stroke-width="2"/><path d="M17 22v-10h16v10M17 48v10h16V48" fill="none" stroke="#8fd8ff" stroke-width="2"/><text x="25" y="86" text-anchor="middle" class="label">USB-C</text><text x="25" y="104" text-anchor="middle" class="sub">VBUS IN</text></g>
<g transform="translate(320 120)"><rect class="chip" x="-58" y="-36" width="116" height="72" rx="10"/><path d="M-76-18h18M-76 0h18M-76 18h18M58-18h18M58 0h18M58 18h18" stroke="#c9803f" stroke-width="3"/><text y="-4" text-anchor="middle" class="label">CHARGE</text><text y="16" text-anchor="middle" class="sub">IC / BATTERY</text></g>
<g transform="translate(530 205)"><circle r="76" fill="#071426" stroke="#c9803f" stroke-width="3"/><circle r="94" fill="none" stroke="#8fd8ff" stroke-dasharray="3 8" opacity=".65"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></circle><rect x="-46" y="-35" width="92" height="70" rx="9" fill="#0a172b" stroke="#f0bf5f" stroke-width="2"/><text y="-2" text-anchor="middle" fill="#f0bf5f" font-size="20" font-weight="800">PMIC</text><text y="18" text-anchor="middle" class="sub">RAIL HUB</text></g>
<g transform="translate(760 123)"><rect class="chip" x="-58" y="-36" width="116" height="72" rx="10"/><text y="-4" text-anchor="middle" class="label">CPU</text><text y="16" text-anchor="middle" class="sub">CORE RAIL</text></g><g transform="translate(760 287)"><rect class="chip" x="-58" y="-36" width="116" height="72" rx="10"/><text y="-4" text-anchor="middle" class="label">UFS / DDR</text><text y="16" text-anchor="middle" class="sub">BOOT PATH</text></g>
<g transform="translate(1030 205)"><circle r="49" fill="#071426" stroke="#3ddc97" stroke-width="2"/><path d="M-18 2l12 12 25-29" fill="none" stroke="#3ddc97" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100"><animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;.35;.82;1" dur="4s" repeatCount="indefinite"/></path><text y="77" text-anchor="middle" fill="#3ddc97" font-size="14" font-weight="700">STABLE</text></g>
<g><circle r="8" class="hot"><animateMotion dur="3.2s" repeatCount="indefinite" path="M104 205H234l34-46h150l35 46h123"/></circle><circle r="7" fill="#ffdca8" filter="url(#g)"><animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite" path="M576 205l70-82h155l35 82h130"/></circle><circle r="7" fill="#ffdca8" filter="url(#g)"><animateMotion dur="3.2s" begin="2s" repeatCount="indefinite" path="M576 205l70 82h155l35-82h130"/></circle></g>
<g transform="translate(42 347)"><rect width="1116" height="28" rx="14" fill="#071326" stroke="#1f4f9a"/><text x="20" y="19" class="m sub">CURRENT TRACE</text><text x="175" y="19" class="m" fill="#f4f1e8" font-size="12">USB-C  →  CHARGING IC  →  PMIC RAIL HUB  →  CPU / UFS BOOT  →  VERIFIED</text></g>
</svg>
